<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Lumiére Instagramストーリーバナー">
  <defs>
    <style>
      .bg{fill:#fbf8f4}
      .s{fill:none;stroke:#b08d57;stroke-linecap:round;stroke-linejoin:round}
      .l{fill:#b08d57}
      .ink{fill:#2f2a25}
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1080" height="1920"/>
  <!-- soft top gradient band -->
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#efe4d4"/><stop offset="1" stop-color="#fbf8f4"/>
  </linearGradient></defs>
  <rect width="1080" height="560" fill="url(#g)"/>
  <rect class="s" x="56" y="56" width="968" height="1808" stroke-width="1.5"/>

  <!-- top botanical -->
  <g transform="translate(540,150)" opacity="0.6">
    <path class="s" d="M0,0 C -40,40 -60,90 -64,150" stroke-width="1.3"/>
    <path class="s" d="M0,0 C 40,40 60,90 64,150" stroke-width="1.3"/>
    <g class="l">
      <g transform="translate(-50,80) rotate(-30)"><path d="M0,0 C -12,-3 -26,3 -34,14 C -22,18 -7,11 0,0 Z"/></g>
      <g transform="translate(50,80) rotate(30)"><path d="M0,0 C 12,-3 26,3 34,14 C 22,18 7,11 0,0 Z"/></g>
    </g>
  </g>

  <!-- monogram -->
  <g transform="translate(540,470)">
    <circle class="s" r="72" stroke-width="1.5"/>
    <circle class="s" r="64" stroke-width="0.7" opacity="0.5"/>
    <text class="serif" x="0" y="26" text-anchor="middle" font-style="italic" font-size="78" fill="#b08d57">L</text>
  </g>

  <text class="sans" x="540" y="650" text-anchor="middle" font-size="28" letter-spacing="12" fill="#b08d57">PRIVATE BEAUTY SALON</text>

  <!-- headline stacked -->
  <text class="serif ink" x="540" y="800" text-anchor="middle" font-size="92">髪も、肌も、</text>
  <text class="serif ink" x="540" y="920" text-anchor="middle" font-size="92">心も。</text>
  <text class="sans" x="540" y="1010" text-anchor="middle" font-size="34" fill="#7a7068">整える時間を、あなたに。</text>

  <!-- divider -->
  <g transform="translate(540,1090)">
    <line class="s" x1="-170" y1="0" x2="-34" y2="0" stroke-width="1.2"/>
    <line class="s" x1="34" y1="0" x2="170" y2="0" stroke-width="1.2"/>
    <circle class="l" cx="0" cy="0" r="4"/>
  </g>

  <!-- promo -->
  <text class="serif" x="540" y="1230" text-anchor="middle" font-size="150" fill="#b08d57" font-weight="bold">20<tspan font-size="84">%</tspan> OFF</text>
  <text class="sans ink" x="540" y="1300" text-anchor="middle" font-size="34">初回限定キャンペーン実施中</text>

  <!-- CTA pill -->
  <g transform="translate(540,1480)">
    <rect x="-280" y="-58" width="560" height="116" rx="58" fill="#b08d57"/>
    <text class="sans" x="0" y="14" text-anchor="middle" font-size="40" fill="#fff" font-weight="bold">Web予約はこちら →</text>
  </g>
  <text class="sans" x="540" y="1600" text-anchor="middle" font-size="28" fill="#7a7068">プロフィールのリンクから24時間受付</text>

  <!-- footer info -->
  <text class="sans" x="540" y="1720" text-anchor="middle" font-size="28" fill="#7a7068">渋谷駅 徒歩3分 ／ 完全予約制 ／ 10:00–20:00</text>
  <text class="serif ink" x="540" y="1800" text-anchor="middle" font-size="54" letter-spacing="5">Lumi<tspan fill="#b08d57">é</tspan>re</text>
</svg>
