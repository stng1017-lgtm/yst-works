<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Lumiére OGP/Xバナー">
  <defs>
    <style>
      .bg{fill:#fbf8f4}
      .s{fill:none;stroke:#b08d57;stroke-linecap:round;stroke-linejoin:round}
      .l{fill:#b08d57}
      .ink{fill:#2f2a25}
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}
    </style>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f4"/><stop offset="1" stop-color="#efe4d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#gr)"/>
  <rect class="s" x="40" y="40" width="1120" height="550" stroke-width="1.5"/>

  <!-- right botanical column -->
  <g transform="translate(1200,0)" opacity="0.5">
    <path class="s" d="M-120,60 C -200,180 -210,360 -150,560" stroke-width="1.4"/>
    <g class="l">
      <g transform="translate(-185,200) rotate(-20)"><path d="M0,0 C -16,-4 -34,3 -46,18 C -28,23 -9,15 0,0 Z"/></g>
      <g transform="translate(-200,300) rotate(18)"><path d="M0,0 C 16,-4 34,3 46,18 C 28,23 9,15 0,0 Z"/></g>
      <g transform="translate(-185,410) rotate(-24)"><path d="M0,0 C -16,-4 -34,3 -46,18 C -28,23 -9,15 0,0 Z"/></g>
      <circle cx="-120" cy="60" r="4"/>
    </g>
  </g>

  <!-- monogram right -->
  <g transform="translate(980,315)">
    <circle class="s" r="74" stroke-width="1.5"/>
    <circle class="s" r="66" stroke-width="0.7" opacity="0.5"/>
    <text class="serif" x="0" y="26" text-anchor="middle" font-style="italic" font-size="80" fill="#b08d57">L</text>
  </g>

  <!-- left text block -->
  <text class="sans" x="110" y="210" font-size="24" letter-spacing="9" fill="#b08d57">PRIVATE BEAUTY SALON</text>
  <text class="serif ink" x="106" y="300" font-size="68">髪も、肌も、心も。</text>
  <text class="serif ink" x="106" y="378" font-size="68">整える時間を。</text>
  <text class="sans" x="110" y="438" font-size="28" fill="#7a7068">完全予約制のプライベートサロン ／ 渋谷駅 徒歩3分</text>

  <!-- divider + wordmark -->
  <g transform="translate(110,492)">
    <line class="s" x1="0" y1="0" x2="90" y2="0" stroke-width="1.2"/>
    <circle class="l" cx="110" cy="0" r="3.5"/>
  </g>
  <text class="serif ink" x="106" y="540" font-size="52" letter-spacing="4">Lumi<tspan fill="#b08d57">é</tspan>re</text>
</svg>
