<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520" role="img" aria-label="botanical flourish">
  <defs>
    <style>
      .s{fill:none;stroke:#b08d57;stroke-linecap:round;stroke-linejoin:round}
      .l{fill:#b08d57}
    </style>
  </defs>
  <g opacity="0.5">
    <!-- main arcing branch -->
    <path class="s" d="M390,30 C 300,90 250,180 240,300 C 235,380 250,450 300,500" stroke-width="1.3"/>
    <!-- secondary branch -->
    <path class="s" d="M300,150 C 330,170 360,175 392,168" stroke-width="0.9" opacity="0.8"/>
    <path class="s" d="M250,250 C 215,265 195,290 188,330" stroke-width="0.9" opacity="0.8"/>

    <!-- leaves along the main branch (almond shapes with vein) -->
    <g class="l">
      <g transform="translate(300,150) rotate(20)"><path d="M0,0 C 10,-3 22,2 30,12 C 18,15 6,10 0,0 Z" opacity="0.85"/></g>
      <g transform="translate(255,210) rotate(-25)"><path d="M0,0 C -10,-3 -22,2 -30,12 C -18,15 -6,10 0,0 Z" opacity="0.85"/></g>
      <g transform="translate(248,275) rotate(15)"><path d="M0,0 C 9,-3 20,2 27,11 C 16,14 5,9 0,0 Z" opacity="0.85"/></g>
      <g transform="translate(232,330) rotate(-30)"><path d="M0,0 C -9,-3 -20,2 -27,11 C -16,14 -5,9 0,0 Z" opacity="0.85"/></g>
      <g transform="translate(245,390) rotate(22)"><path d="M0,0 C 9,-3 20,2 27,11 C 16,14 5,9 0,0 Z" opacity="0.85"/></g>
      <g transform="translate(265,445) rotate(-18)"><path d="M0,0 C -9,-3 -20,2 -27,11 C -16,14 -5,9 0,0 Z" opacity="0.85"/></g>
    </g>
    <!-- small berries -->
    <circle class="l" cx="392" cy="168" r="2.4"/>
    <circle class="l" cx="188" cy="330" r="2.4"/>
    <circle class="l" cx="300" cy="500" r="2.4"/>
  </g>
</svg>
